# MoGuk — 개발용 Compose (skeleton v3, docs/skeleton-v3.md §5) [병갑]
# 사용: cp .env.example .env → POSTGRES_PASSWORD 등 채움 → docker compose up -d --build
#       stt·dagster 는 이미지 자리만 확보(profile full) — 기본 up 에서는 제외되어 나머지 6종이 먼저 뜬다.
#       전체: docker compose --profile full up -d
#
# 네트워크:
#   core_net — postgres, ollama, stt, core-api, dagster. 외부 라우트 없음(internal).
#   edge_net — caddy, edge-api, frontend.
#   core-api → edge-api 는 outbound 단방향만. Docker 네트워크는 대칭이므로 방향성은
#   "core-api가 edge_net에서 리슨하지 않는다"(앱 레벨)로 보장 — 병갑 검토 항목.

services:
  # ── core_net ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moguk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (.env)}
      POSTGRES_DB: ${POSTGRES_DB:-moguk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [core_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moguk} -d ${POSTGRES_DB:-moguk}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    volumes:
      - ollama_models:/root/.ollama
    networks: [core_net]
    # GPU 머신: deploy.resources.reservations.devices 추가 (병갑). 모델 pull: ollama pull qwen3:8b qwen3:4b (M-03)
    restart: unless-stopped

  stt:
    # faster-whisper 전용 컨테이너 (M-18). 이미지 자리만 — 빌드/배포는 병갑 트랙.
    image: ${STT_IMAGE:-moguk-stt:dev}
    profiles: [full]
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    mem_limit: 2g
    cpus: 2
    networks: [core_net]
    restart: unless-stopped

  core-api:
    build: ./backend
    environment:
      API_ROLE: core
      DATABASE_URL: postgresql://${POSTGRES_USER:-moguk}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (.env)}@postgres:5432/${POSTGRES_DB:-moguk}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-qwen3:4b}
      STT_URL: http://stt:8000
      EDGE_API_URL: http://edge-api:8000
      EXTERNAL_LLM_API_KEY: ${EXTERNAL_LLM_API_KEY:-}
      TENANT_CRYPTO_KEY: ${TENANT_CRYPTO_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      APP_VERSION: ${APP_VERSION:-0.1.0-dev}
      APP_SLOT: ${APP_SLOT:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core_net, edge_net]   # edge_net 가입은 edge-api 로의 outbound 전용 (위 주석)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health', timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dagster:
    # Dagster 웹서버+데몬 (M-16). 이미지 자리만 — pipeline/ 에셋화(8/24) 시 build 로 전환 [명선·병갑]
    image: ${DAGSTER_IMAGE:-moguk-dagster:dev}
    profiles: [full]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-moguk}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (.env)}@postgres:5432/${POSTGRES_DB:-moguk}
      OLLAMA_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core_net]
    restart: unless-stopped

  # ── edge_net ──────────────────────────────────────────────
  edge-api:
    build: ./backend
    environment:
      API_ROLE: edge
      DATABASE_URL: postgresql://${POSTGRES_USER:-moguk}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (.env)}@postgres:5432/${POSTGRES_DB:-moguk}
      JWT_SECRET: ${JWT_SECRET:-}
      APP_VERSION: ${APP_VERSION:-0.1.0-dev}
      APP_SLOT: ${APP_SLOT:-dev}
    ports:
      - "8000:8000"   # dev 직접 호출용 (curl localhost:8000/health). prod 는 caddy 경유만
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge_net, core_net]   # 스켈레톤 단계: /health 의 DB 체크를 위해 core_net 가입 — 본 구현에서 core-api 경유로 전환 시 제거 (M-xx 채번 대상)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health', timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    networks: [edge_net]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [edge-api, frontend]
    networks: [edge_net]
    restart: unless-stopped

networks:
  core_net:
    # prod 는 internal: true (외부 라우트 없음). dev 는 컨테이너 내부 `ollama pull` 편의상 해제 — 병갑 확인 항목.
  edge_net:

volumes:
  pgdata:
  ollama_models:
  caddy_data:
